<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Upload Dataset</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; max-width: 500px; color: #222; }
        h1 { margin-bottom: 0.5rem; }
        form { padding: 1rem; border: 1px solid #eee; border-radius: 6px; }
        input[type="file"] { display: block; margin: 0.75rem 0; }
        button {
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid #1a5fb4;
            background: #3388ff;
            color: white;
            cursor: pointer;
        }
        .message { padding: 10px; border-radius: 4px; margin-bottom: 1rem; }
        .message.success { background: #e6f4ea; color: #1e7e34; }
        .message.error { background: #fdecea; color: #b3261e; }
    </style>
</head>
<body>
    <h1>Upload Dataset</h1>

    {% for message in messages %}
    <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file" accept=".json" required />
        <button type="submit">Upload dataset</button>
    </form>
</body>
</html>
